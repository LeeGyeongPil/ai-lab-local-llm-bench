[project]
name = "ai-lab-local-llm-bench"
version = "0.1.1"
description = "로컬 LLM(Ollama) 속도를 대기·로드·프리필·디코드로 쪼개 재는 도구"
requires-python = ">=3.10"
dependencies = []  # 실행에는 표준 라이브러리만 쓴다

[dependency-groups]
dev = ["pytest"]  # 테스트는 unittest 로 쓰였고, `uv run pytest -q` 로도 수집된다

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
