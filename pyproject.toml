[project]
name = "ai-lab-local-llm-bench"
version = "0.2.0"
description = "로컬 LLM(Ollama) 속도를 대기·로드·프리필·디코드로 쪼개 재는 도구"
requires-python = ">=3.10"
dependencies = []  # 실행에는 표준 라이브러리만 쓴다

[dependency-groups]
dev = ["pytest"]  # 테스트는 pytest 로 돌린다 (`uv run pytest -q`; test_i18n.py 가 pytest 픽스처를 쓴다)

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
